name: displace-dev

services:
  api:
    build:
      context: ./repos/server
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-1048576}
      UPLOAD_LIMIT_BYTES: ${UPLOAD_LIMIT_BYTES:-26214400}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-displace_app}:${POSTGRES_RUNTIME_PASSWORD:-displace_app_dev}@postgres:5432/${POSTGRES_DB:-displace}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-2000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-10000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-5000}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-displace}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-displace_dev_secret}
      S3_BUCKET: ${MINIO_BUCKET:-displace}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-displace-dev-search-key}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-development-access-token-secret-change-me}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-development-refresh-token-pepper-change-me}
      COOKIE_SECRET: ${COOKIE_SECRET:-development-cookie-signing-secret-change-me}
      CURSOR_SECRET: ${CURSOR_SECRET:-development-cursor-signing-secret-change-me}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@localhost.invalid}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      SINGLE_PLACE_MODE: ${SINGLE_PLACE_MODE:-false}
      SINGLE_PLACE_SLUG: ${SINGLE_PLACE_SLUG:-}
    ports:
      - "${API_PORT:-3001}:3000"
    volumes:
      - ./repos/server:/workspace
      - api_node_modules:/workspace/node_modules
    depends_on:
      database-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
      livekit:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health/live').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true

  worker:
    build:
      context: ./repos/server
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "CI=true pnpm install --frozen-lockfile && pnpm worker:dev"]
    env_file:
      - .env.example
    environment:
      NODE_ENV: development
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-displace_app}:${POSTGRES_RUNTIME_PASSWORD:-displace_app_dev}@postgres:5432/${POSTGRES_DB:-displace}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      MEILISEARCH_HOST: http://meilisearch:7700
      LIVEKIT_URL: http://livekit:7880
      SMTP_HOST: ${SMTP_HOST:-mailpit}
    volumes:
      - ./repos/server:/workspace
      - worker_node_modules:/workspace/node_modules
    depends_on:
      database-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    init: true

  database-migrate:
    build:
      context: ./repos/server
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "CI=true pnpm install --frozen-lockfile && pnpm db:setup && pnpm db:seed"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-displace_app}:${POSTGRES_RUNTIME_PASSWORD:-displace_app_dev}@postgres:5432/${POSTGRES_DB:-displace}
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER:-displace}:${POSTGRES_PASSWORD:-displace_dev}@postgres:5432/${POSTGRES_DB:-displace}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./repos/server:/workspace
      - migration_node_modules:/workspace/node_modules
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-displace}
      POSTGRES_USER: ${POSTGRES_USER:-displace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-displace_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-displace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-displace_dev_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-displace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-displace_dev_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-displace}
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do sleep 1; done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-displace-dev-search-key}
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data

  livekit:
    image: livekit/livekit-server:v1.9
    command: --config /etc/livekit.yaml
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./infra/livekit.dev.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  coturn:
    image: coturn/coturn:4.6-alpine
    command:
      - --no-cli
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=localhost
      - --user=${TURN_USERNAME:-displace}:${TURN_PASSWORD:-displace_dev}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "${TURN_PORT:-3478}:3478"
      - "${TURN_PORT:-3478}:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  api_node_modules:
  worker_node_modules:
  migration_node_modules:
  postgres_data:
  redis_data:
  minio_data:
  meilisearch_data: